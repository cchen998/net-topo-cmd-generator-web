name: Upstream Sync

on:
  schedule:
    # 每 3 天 UTC 07:00 执行一次（即每月 1、4、7、10、13、16、19、22、25、28、31 日）
    - cron: '0 7 */3 * *'
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo
    permissions:
      contents: write  # 需要写权限才能向你的仓库推送更新

    steps:
      # 步骤 1：检出你的 Fork 仓库
      - name: Checkout target repo
        uses: actions/checkout@v4

      # 步骤 2：执行同步
      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: bobhe2016/net-topo-cmd-generator-web  # 上游仓库
          upstream_sync_branch: main                                # 上游分支名
          target_sync_branch: main                                  # 你的 Fork 分支名
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}            # 自动令牌，用于推送
          test_mode: false                                          # 正式运行
